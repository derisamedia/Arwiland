<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!-- App Squircle Background (Flat Zinc-950) -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="#09090B"/>

  <!-- Screen Surface Preview -->
  <rect x="32" y="32" width="192" height="192" rx="42" fill="#121215"/>

  <!-- Living Notch Silhouette at Top Center -->
  <path d="M56 32 C66 32 68 40 68 48 L68 70 C68 83.2548 78.7452 94 92 94 L164 94 C177.255 94 188 83.2548 188 70 L188 48 C188 40 190 32 200 32 Z" fill="#050508"/>

  <!-- Equalizer / Activity Bars inside Notch (Left) -->
  <rect x="86" y="56" width="5" height="14" rx="2.5" fill="#10B981"/>
  <rect x="95" y="49" width="5" height="28" rx="2.5" fill="#34D399"/>
  <rect x="104" y="54" width="5" height="18" rx="2.5" fill="#10B981"/>

  <!-- Notch Status Pill (Right) -->
  <rect x="122" y="57" width="48" height="12" rx="6" fill="#27272A"/>
  <circle cx="164" cy="63" r="6" fill="#38BDF8"/>

  <!-- Expanded Control Surface Card Below Notch -->
  <rect x="52" y="114" width="152" height="86" rx="22" fill="#18181B"/>

  <!-- Album / Notification Badge inside Expanded Card -->
  <rect x="66" y="128" width="38" height="38" rx="11" fill="#10B981" fill-opacity="0.22"/>
  <circle cx="85" cy="147" r="9" fill="#34D399"/>

  <!-- Title & Subtitle Lines -->
  <rect x="116" y="132" width="68" height="10" rx="5" fill="#F4F4F5"/>
  <rect x="116" y="149" width="48" height="8" rx="4" fill="#A1A1AA"/>

  <!-- Interactive Volume / Media Bar at Bottom of Card -->
  <rect x="66" y="178" width="124" height="8" rx="4" fill="#27272A"/>
  <rect x="66" y="178" width="82" height="8" rx="4" fill="#38BDF8"/>
  <circle cx="148" cy="182" r="7" fill="#F4F4F5"/>
</svg>
