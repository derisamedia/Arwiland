[package]
name = "arwiland"
version = "0.0.1"
edition = "2021"
description = "Arwiland - Ultra-Lightweight Universal Dynamic Island & Living Notch (Pure Rust, No GTK4)"
authors = ["Arwiyah"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tiny-skia = "0.11"
fontdue = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr"] }
zbus = { version = "4", default-features = false, features = ["async-io"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
