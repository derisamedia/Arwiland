[package]
name = "arwiland"
version = "0.0.1"
edition = "2021"
description = "Arwiland - Cross-Platform Dynamic Island & Living Notch (Linux, Windows, macOS) built with Rust & GTK4"
authors = ["Arwiyah"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
glib = "0.20"
gio = "0.20"
cairo-rs = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk4-x11 = "0.9"
libc = "0.2"
