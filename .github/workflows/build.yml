name: Cross-Platform Build (Linux, Windows, macOS)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 & X11 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libglib2.0-dev libx11-dev pkg-config
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary
        run: cargo build --release
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arwiland-Linux-x86_64
          path: |
            target/release/arwiland
            assets/
            install.sh
            run.sh
            README.md

  build-macos:
    name: Build macOS (Apple Silicon / Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 via Homebrew
        run: brew install gtk4 pkg-config cairo pango gdk-pixbuf glib
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary
        run: cargo build --release
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arwiland-macOS
          path: |
            target/release/arwiland
            assets/
            README.md

  build-windows:
    name: Build Windows (x86_64 .exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 (UCRT64) & GTK4
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
      - name: Build Windows Release (.exe)
        run: cargo build --release
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arwiland-Windows-x86_64
          path: |
            target/release/arwiland.exe
            assets/
            README.md
